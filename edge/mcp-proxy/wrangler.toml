name = "cob-mcp-proxy"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Route binding — set after the zone (chiefofbusiness.ai) is added to the
# Cloudflare account. Until then, the worker is reachable at its
# *.workers.dev hostname and the CNAME below points at that.
routes = [
  { pattern = "mcp.chiefofbusiness.ai/*", zone_name = "chiefofbusiness.ai" }
]

[vars]
# Upstream Supabase Edge Function host. Phase 2B targets the Lovable Cloud
# project; Phase 4 eject swaps this to the Jake-owned project ref.
UPSTREAM_URL = "https://vacpgxxgdfhgvkduljgs.supabase.co/functions/v1/mcp-council"
# Authorization Server lives on a separate, Jake-owned Supabase project
# (ref: rnjqpwmzmbnnaonppfkm). Lovable Cloud does not expose the OAuth 2.1
# Server toggle, so the AS is hosted externally and mcp-council verifies
# tokens against this issuer's JWKS.
AS_DISCOVERY_URL = "https://rnjqpwmzmbnnaonppfkm.supabase.co/.well-known/oauth-authorization-server/auth/v1"
RESOURCE_ID = "https://mcp.chiefofbusiness.ai/"
