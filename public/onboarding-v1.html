<!--
================================================================================
COB ONBOARDING EXPERIENCE v1 · single-file · dossier brand (chiefofbusiness.ai/login twin)
Built HERE, perfected here, then uploaded to Lovable and served verbatim.

LOVABLE INTEGRATION CONTRACT (wire these, change nothing else):
  1. AUTH: email-first + providers. Wire emailContinue/signup/signin to Supabase Auth (signUp, signInWithPassword); provider buttons to signInWithOAuth (google, apple, azure), WebAuthn passkeys, and SAML SSO. Session -> COB.state.user. Terms/Privacy links point to chiefofbusiness.ai/terms and /privacy (pages owed, KNOX-drafted).
  2. PERSISTENCE: COB.save() currently writes localStorage key "cob_onboarding_v1".
     Mirror the same JSON to intake_state/onboarding_tenants (schema already live in the project).
     Every answer change calls COB.save() -> also debounce-post to Supabase.
  3. FILES: the harvest upload dropzones fire COB.onFileSelected(kind, file) -> wire to storage bucket + intake_files.
  4. ESCALATIONS: COB.escalate(reason) -> insert into onboarding_escalations, then show the built-in confirmation.
  5. STATUS: dashboard build-stage reads COB.state.stage ("intake"|"files"|"build"|"review"|"live") -> read from onboarding_tenants.status.
  6. CONNECTOR URL: replace {{COB_CONNECTOR_URL}} in the connect act when the OAuth endpoint ships.
  7. DEEPDIVE AT SIGNUP (dossier grade): the study fires on signup with EVERYTHING collected: first + last name, email domain, city/area, profession, LinkedIn URL, website (state.study + state.user). It is a PERSON-level + company-level sweep (the /person + /company dossier standard): LinkedIn profile, their site, news, registries, public record; the area + profession fields disambiguate same-name collisions before any result counts. Wire: pass the full identifier set to the deepdive edge function; results populate UNDERSTANDING and the coverage model.
  8. TAYLOR DOCK PAGE-AWARENESS: every dockSend records ctx="page:<route>". At integration, the taylor-chat edge function also receives a serialized snapshot of the current page state (route, step completion, visible section, current question) so TAYLOR answers about exactly what the client is looking at, with full COB knowledge behind it. Replies stream back into the dock panel and mirror to the dashboard TAYLOR section.
  9. TAYLOR LIVE (Phase 2): the fireside chat and every Ask-TAYLOR box wire to a taylor-chat edge function running the TAYLOR persona (high-functioning COB identity, canon server-side). Conversation backend = OpenAI API (gpt-4o) via server-side secret. TARGETED COMPILING (binding design): the edge function receives this tenant's FULL compiled context on every turn: deepdive results, briefcase deliverables (raw text), your-world corrections, wishlist, connection status, and the COVERAGE model's fill-state (which slots are answered and by which source). TAYLOR walks the coverage gaps: it asks ONLY what the record cannot answer, probes contradictions between sources, and follows up on thin spots; every exchange writes back to intake_state and marks coverage slots filled. Never a generic question when the record already holds the answer. Voice = OpenAI TTS streamed, with the browser speechSynthesis fallback ALREADY WIRED (COB.speak/voiceToggle; swap the audio source, keep the toggle). The SAME TAYLOR, same context, greets the client inside the COB Connector in Claude: everything compiled during onboarding travels with the tenant.
  Fonts load from fonts.googleapis.com. No other external dependencies. No frameworks.
================================================================================
-->

/* TYPE TRIAL (this doc only, not canon): Aeonik display / Hanken Grotesk body / Spline Sans Mono labels.
   Aeonik is commercial; Figtree stands in via the fallback chain. When licensed, add:
   @font-face{font-family:'Aeonik';src:url('/fonts/Aeonik-Regular.woff2') format('woff2');font-weight:400}
   (repeat for 500/700) and nothing else changes. */
:root{
  --paper:#FAF8F4; --edge:#E5E3DE; --ink:#042C53; --ink-soft:#2A4E78; --charcoal:#2C2C2A; --ash:#5F5E5A;
  --brass:#EF9F27; --brass-deep:#854F0B; --white:#FFFFFF;
  --navy:var(--ink); --marble:var(--paper); --marble-2:#F3F0EA; --marble-3:#ECE8DF; --line:var(--edge); --brass-brown:var(--brass-deep);
  --ok:#2E6B4F; --warn:#8A5A00; --err:#8C2F2F;
  --serif:'Aeonik','Figtree',system-ui,sans-serif; --sans:'Hanken Grotesk',system-ui,sans-serif; --mono:'Spline Sans Mono',monospace;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px; --s7:64px;
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px; --t-2xl:clamp(30px,4.5vw,44px); --t-hero:clamp(38px,5.5vw,60px);
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--charcoal);font-family:var(--sans);font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
img,svg,video,table{max-width:100%}
h1,h2,h3{font-family:var(--serif);color:var(--ink);font-weight:700;line-height:1.12;margin:0 0 var(--s3);letter-spacing:-0.015em}
h1{font-size:var(--t-2xl);font-weight:700;letter-spacing:-0.025em;line-height:1.04} h2{font-size:var(--t-xl)} h3{font-size:var(--t-lg)}
p{margin:0 0 var(--s3)}
a{color:var(--brass-deep);text-underline-offset:3px}
.kicker{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:var(--s3)}
.kicker b{color:var(--brass);font-weight:500}
.hairline{display:flex;align-items:center;gap:8px;margin:var(--s5) 0}
.hairline::before,.hairline::after{content:"";height:1px;flex:1;background:rgba(239,159,39,.4)}
.hairline i{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:none}
button{font-family:var(--sans);cursor:pointer;font-size:var(--t-sm)}
.btn{background:var(--brass);color:var(--ink);border:none;border-radius:3px;padding:14px 30px;font-weight:600;font-size:15px;letter-spacing:.01em;transition:background .22s var(--ease),color .22s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--brass-deep);color:var(--paper)} .btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn2{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:13px 30px;font-weight:500;font-size:15px;letter-spacing:.01em;transition:background .22s var(--ease),transform .12s var(--ease)}
.btn2:hover{background:var(--marble-2)} .btn2:active{transform:scale(.98)}
.btn-ghost{background:none;border:none;color:var(--brass-deep);padding:10px 8px;font-weight:500}
.btn-ghost:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input[type=text],input[type=email],input[type=password],textarea,select{
  width:100%;background:var(--white);border:1px solid var(--edge);border-radius:0;padding:14px 16px;font-family:var(--sans);font-size:var(--t-md);color:var(--charcoal);transition:border-color .22s var(--ease)}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
textarea{min-height:130px;resize:vertical;line-height:1.6}
::placeholder{color:#A8A499;font-style:normal}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
/* chrome header: paper, per dossier header doctrine */
.top{position:sticky;top:0;z-index:40;background:rgba(250,248,244,.92);backdrop-filter:blur(8px);color:var(--ink);display:flex;align-items:center;gap:var(--s3);padding:12px var(--s4);border-bottom:1px solid var(--edge)}
.top .mark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.top .mark b{color:var(--brass);font-weight:500}
.top .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .save{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);display:flex;align-items:center;gap:7px;white-space:nowrap}
.top .save .dot{width:6px;height:6px;border-radius:50%;background:var(--edge);transition:background .3s}
.top .save.ok .dot{background:var(--brass)}
.progress{position:sticky;top:49px;z-index:39;height:2px;background:var(--marble-3)}
.progress i{display:block;height:100%;background:var(--brass);width:0%;transition:width .4s var(--ease)}
/* layout */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 476px;gap:0;width:100%}
@media(max-width:1366px){.stage{grid-template-columns:minmax(0,1fr) 400px}}
body.withrail .stage{margin-left:250px;width:auto}
body.withrail .top{margin-left:250px}
body.withrail .top .logo-mark,body.withrail .top .mark{display:none}
.rail{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:50;background:var(--ink);background-image:radial-gradient(600px 300px at 18% 0%,rgba(239,159,39,.09),transparent 70%),linear-gradient(rgba(250,248,244,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(250,248,244,.05) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px;border-right:2px solid var(--brass);display:flex;flex-direction:column;padding:18px 14px 16px;overflow:hidden}
.r-brand{display:flex;gap:11px;align-items:center;padding:2px 10px 16px;border-bottom:1px solid rgba(250,248,244,.14);margin-bottom:12px}
.r-brand img{width:38px;height:38px;object-fit:contain;border-radius:7px}
.rb-t{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper);line-height:1.4}
.rb-s{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass)}
.r-prog{padding:0 10px 14px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(250,248,244,.55)}
.r-prog i{display:block;height:2px;background:rgba(250,248,244,.15);margin-top:6px}
.r-prog b{display:block;height:2px;background:var(--brass);transition:width .4s ease}
.r-items{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.rail .r-item.done .r-n{background:var(--brass)!important;color:var(--ink)!important;border-color:var(--brass)!important}
.rail .r-item{border-radius:2px}
.rail .r-item:hover{color:var(--paper);background:rgba(250,248,244,.05)}
.rfoot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(250,248,244,.16);display:flex;flex-direction:column;gap:6px}
.rfoot button{background:none;border:1px solid rgba(250,248,244,.28);color:var(--paper);padding:9px 12px;font-size:13px;text-align:left}
.rfoot button:hover{border-color:var(--brass);color:var(--paper)}
.rail .pane-navy .kicker{color:var(--brass)}
.rail .r-item{display:flex;gap:10px;align-items:baseline;padding:10px;border:none;background:none;width:100%;text-align:left;font-size:var(--t-sm);color:rgba(250,248,244,.62);border-left:2px solid transparent;transition:color .18s}
.rail .r-item:hover{color:var(--paper);background:rgba(250,248,244,.06)}
.rail .r-item.on{border-left-color:var(--brass);color:var(--paper);font-weight:600}
.rail .r-item.done{color:rgba(250,248,244,.85)}
.rail .r-item.done .r-n{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.rail .r-n{font-family:var(--mono);font-size:10px;border:1px solid rgba(250,248,244,.3);min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:rgba(250,248,244,.8)}
.rail .rule{background:rgba(250,248,244,.15)}
.rail .tay{background:rgba(250,248,244,.06);border-color:rgba(250,248,244,.2)}
.rail .tay .t-l{color:var(--brass)}
.rail .tay input{background:rgba(250,248,244,.94);border-color:transparent}
.rail .tay .t-hint{color:rgba(250,248,244,.5)}
.rail .btn2{color:var(--paper);border-color:rgba(250,248,244,.4)}
.rail .btn2:hover{background:rgba(250,248,244,.08)}
.rail .btn-ghost{color:var(--brass)}
.main{padding:var(--s6) clamp(16px,4vw,56px);min-height:calc(100vh - 72px)}
.world{position:sticky;top:53px;align-self:start;height:calc(100vh - 53px);display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;overflow:hidden}
.bp{flex:1;min-height:0;display:flex;flex-direction:column}
.bp-body{flex:1;min-height:0;overflow-y:auto}
.tside{flex:none;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--edge);border-top:2px solid var(--brass);box-shadow:0 8px 24px rgba(4,44,83,.08);height:58px;overflow:hidden;transition:height .32s ease}
.tside.open{height:34vh}
.ts-head{height:58px;flex:none;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:11px;padding:0 16px;border:none;width:100%;cursor:pointer;text-align:left}
.ts-head img{width:32px;height:32px;object-fit:contain}
.ts-t{font-family:var(--serif);font-size:18px;flex:1;line-height:1.1}
.ts-t small{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#B9C6D6;margin-left:9px;vertical-align:2px}
.ts-ch{transition:transform .3s ease;flex:none}
.tside.open .ts-ch{transform:rotate(180deg)}
.ts-body{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff}
.ts-msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;font-size:13px}
.ts-msgs .tm-u{background:var(--paper);border:1px solid var(--edge);padding:8px 10px;margin:6px 0 2px;font-size:13px}
.ts-msgs .tm-s{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);margin-bottom:6px}
.ts-hello{color:var(--charcoal);font-size:13px}
.tm-a{background:#fff;border:1px solid var(--edge);border-left:3px solid var(--brass);padding:9px 11px;margin:2px 0 8px;font-size:13px;color:var(--charcoal);animation:rise .3s ease both}
.tm-a .who{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:3px}
.ts-foot{flex:none;display:flex;gap:8px;padding:10px;border-top:1px solid var(--edge)}
.ts-foot input{flex:1;border:1px solid var(--edge);padding:9px 10px;font-size:13px;font-family:var(--sans)}
.ts-foot .snd{background:var(--brass);border:none;color:var(--ink);font-weight:600;padding:0 14px;cursor:pointer}
@media(min-width:1081px){.tdock{display:none!important}}
.bp{background:#fff;border:1px solid var(--edge);box-shadow:0 8px 24px rgba(4,44,83,.06)}
.bp-head{background:var(--ink);color:var(--paper);padding:13px 16px;display:flex;flex-direction:column;gap:3px}
.bp-head .bp-t{font-family:var(--serif);font-size:18px;line-height:1.1}
.bp-head .bp-c{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#B9C6D6;text-transform:uppercase}
.bp-body{padding:14px 16px;min-height:180px}
.bp-sec{margin-bottom:14px}
.bp-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--edge);animation:rise .3s ease both}
.bp-row .ok{color:var(--ok);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.world h4{font-family:var(--mono);font-size:10px;color:var(--brass-deep);text-transform:uppercase;letter-spacing:.22em;margin:0 0 var(--s3);font-weight:500}
.w-group{margin-bottom:var(--s4)}
.w-label{font-size:10px;color:var(--ash);margin-bottom:6px;font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase}
.chip{display:inline-block;background:var(--white);border:1px solid var(--edge);padding:5px 10px;font-size:var(--t-xs);margin:0 6px 6px 0;animation:rise .3s var(--ease);color:var(--charcoal)}
.chip.navy{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.w-empty{font-size:var(--t-xs);color:#A8A499;font-style:italic}
/* question screens */
.q-wrap{max-width:640px}
.q-count{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);margin-bottom:var(--s3)}
.q-text{font-family:var(--serif);font-size:var(--t-xl);font-weight:700;color:var(--ink);line-height:1.25;margin-bottom:var(--s2)}
.q-why{font-size:var(--t-sm);color:var(--ash);margin-bottom:var(--s4)}
.q-input{position:relative;margin-bottom:var(--s3)}
.mic{position:absolute;right:8px;top:8px;background:var(--white);border:1px solid var(--edge);width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--brass-deep);transition:border-color .18s}
.mic:hover{border-color:var(--ink)}
.mic.rec{background:var(--brass);color:var(--ink);border-color:var(--brass);animation:pulse 1.2s infinite}

.q-actions{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s4)}
.hintline{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin-top:var(--s2)}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin:var(--s3) 0}
.choice{border:1px solid var(--edge);background:var(--white);padding:12px 18px;font-size:var(--t-sm);border-radius:0;color:var(--charcoal);transition:border-color .18s,background .18s}
.choice:hover{border-color:var(--ink)} .choice.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* cards */
.card{background:var(--white);border:1px solid var(--edge);padding:var(--s4)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
/* THE NAVY PANE (dossier brand bible §17, verbatim recipe) */
.pane-navy{position:relative;overflow:hidden;color:var(--paper);padding:clamp(32px,6vw,80px);display:flex;flex-direction:column;justify-content:center;
  background-color:var(--ink);
  background-image:
    radial-gradient(ellipse 60% 55% at 82% 12%, rgba(239,159,39,.18), transparent 60%),
    radial-gradient(ellipse 55% 55% at 12% 92%, rgba(42,78,120,.28), transparent 65%),
    linear-gradient(160deg, hsl(211 93% 8%) 0%, #042C53 55%, hsl(210 82% 22%) 100%);}
.pane-navy::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%, black 40%, transparent 85%);
  mask-image:radial-gradient(ellipse 75% 70% at 50% 45%, black 40%, transparent 85%);}
.pane-navy>*{position:relative;z-index:1}
.pane-navy h1{color:var(--paper);font-size:var(--t-hero);line-height:1.05}
.pane-navy p{color:rgba(250,248,244,.78)}
.chip-eyebrow{display:inline-block;background:var(--brass);color:var(--ink);font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:6px 10px;border-radius:3px;margin-bottom:var(--s4);width:max-content}
.brass-u{color:var(--brass);font-weight:500;border-bottom:none;padding-bottom:0}
.pane-navy .brass-u{color:var(--brass)}
.mono-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:auto;padding-top:var(--s5);flex-wrap:wrap}
.pane-form{padding:clamp(32px,6vw,80px);display:flex;flex-direction:column;justify-content:center;max-width:560px;width:100%;margin:0 auto}
.field{margin-bottom:var(--s3)}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:7px}

OPERATING RULES (binding):
1. Truth labels. Tag every load-bearing claim: [DOCUMENTED-MEM] (saved memory) · [DOCUMENTED-CHAT] (retrieved from past conversations, only if you truly can) · [DOCUMENTED-CTX] (this conversation) · [DOCUMENTED-PC] (retrieved personal context) · [INFERRED] (your read from patterns; say what it rests on) · [UNKNOWN] (never guess). If you cannot reach a source, say so in GAPS; never pretend. Fabricating anything is the one unforgivable failure.
2. If you can search past conversations or chat history, do so. It is a richer source than saved memory alone.
3. No sensitive identifiers. Never output Social Security numbers, full account numbers, card numbers, passwords, or exact balances. Refer to accounts by nickname only.
4. Completeness over brevity. If you know 40 facts, give 40 facts. Do not summarize away detail.
5. Where you are thin, say so. End every deliverable with a "GAPS" list: what a chief of staff would want that you cannot supply.
6. Format. Every deliverable is a standalone markdown document: a # title, a one-line purpose, YAML front matter (deliverable name, date, confidence high/medium/low), then clear ## sections with bullet points. Sentence-level facts, one per bullet.

DELIVERY (self-select the highest tier you can honestly do; never stop to ask permission):
- TIER 1 (you can create files AND handle it in one pass): produce everything at once. Each deliverable as its own .md file, plus COB_BRIEFCASE.html (spec below), bundled into ONE zip named COB_BRIEFCASE.zip. Hand me the download link.
- TIER 2 (you can create files, but not all in one response): work in WAVES and continue automatically between them. Wave 1: MEMORY_INVENTORY.md plus deliverables 1 to 3, as downloadable .md files. Wave 2: deliverables 4 to 7. Wave 3: deliverables 8 to 10 plus COB_BRIEFCASE.html, then bundle EVERYTHING from all waves into COB_BRIEFCASE.zip and hand me the link. If a wave runs long, write CONTINUING and keep going. Do not wait for me between waves.
- TIER 3 (no file tools at all): deliver in messages, each deliverable starting with a marker line exactly like: === FILE: IDENTITY_PROFILE.md === . Continue automatically across as many messages as it takes.
- In TIER 1 or 2, COB_BRIEFCASE.html is required: a single self-contained page presenting every deliverable, branded EXACTLY as follows. Background #FAF8F4 (warm paper, never pure white). Deep navy #042C53 for headlines and a top banner. Brass #EF9F27 as the ONLY accent color. Body text #2C2C2A. Headlines in Fraunces, body in Inter, small uppercase labels in JetBrains Mono with wide letter spacing (Google Fonts). Layout: a navy header band reading CHIEF OF BUSINESS · THE BRIEFCASE with today's date in mono; a summary strip with deliverable and fact counts; one card per deliverable (white, 1px #E5E3DE border, square corners) with title, confidence badge, collapsible sections, and any GAPS section highlighted with a brass left border. No em dashes. No external scripts; opens offline with a double click.
- Start with MEMORY_INVENTORY.md (a numbered, near-verbatim enumeration of every saved memory you hold about me), then the ten deliverables in order.

THE TEN DELIVERABLES:

1. IDENTITY_PROFILE.md
Who I am: name, location, family facts you know, roles and titles, entities I own or lead, professional history, public footprint, how I describe myself, what I care about most. Include a "how I make decisions" section based on everything you have seen.

2. VENTURES_AND_ENTITIES.md
Every business, entity, deal, investment, and project you know of: legal structure, ownership stakes, status, key numbers mentioned, stage, what is in flight, what is stalled. One ## section per entity. Include deals or ideas I mentioned once and dropped, flagged as such.

3. PEOPLE_MAP.md
Every person you know in my world: name, relationship to me, role, organization, context of how they come up, current state of the relationship, and any open items between us. Group by category (family, partners, investors, advisors, counterparties, team, friends).

4. WORKFLOWS_AND_PROCESSES.md
How I actually work: recurring processes you have watched me run, how I handle email, meetings, follow-ups, content, sales, finance, and admin. What I do repeatedly, in what order, with what tools. Include the processes I have complained about or asked for help with more than once, and where the friction is.

5. GOALS_VISION_VALUES.md
My stated goals (short and long horizon), the vision behind them, my priorities as I have ranked or implied them, values I have expressed, lines I will not cross, and what winning looks like in my own words. Quote me where you can.

6. DECISIONS_LOG.md

 vDashboard(){const w=this.world();const a=this.state.answers;const stageIdx={intake:0,files:1,build:2,review:3,live:4}[this.state.stage]||0;
  const stages=[["Intake complete","Your world, in your words, on the record."],["Files received","Your memory pull and documents are in the vault."],["Build in progress","Your COB's identity is being written from your answers."],["Review","You walk the finished build with our team before it goes live."],["Go live","You meet your COB inside Claude. First morning brief follows."]];
  this._reg={};let _rid=0;const reg=h=>{const id="r"+(++_rid);this._reg[id]=h;return id};
  const kpi=(v,l,d)=>`<button class="kpi" onclick="COB.openDrawer(COB._reg.${reg(d)})"><div class="k-v">${v}</div><div class="k-l">${l}</div></button>`;
  const card=(k,t,s,body)=>`<button class="wcard" onclick="COB.openDrawer(COB._reg.${reg(body)})"><div class="wc-k">${k}</div><div class="wc-t">${t}</div><div class="wc-s">${s}</div></button>`;
  const dw=(title,items,editHash)=>`<p class="kicker">${title}</p>${items.length?items.map(x=>`<p style="border-bottom:1px solid var(--line);padding:8px 0;margin:0">${this.esc(x)}</p>`).join(""):"<p class='w-empty'>Nothing here yet. Answer the chapter and it fills in.</p>"}<div class="q-actions"><button class="btn2" onclick="COB.closeDrawer();COB.go('${editHash}')">Edit these answers</button></div>`;
  return `<div class="stage" style="grid-template-columns:minmax(0,1fr)"><main class="main" style="max-width:980px;margin:0 auto;width:100%">
  ${this.backbar("your private build page")}
  <p class="kicker">your build · ${this.esc(this.state.user?.name||"")}</p>
  <h1>Your COB is in build. Here's what we already know.</h1>
  <div class="kpis">
   ${kpi(this.pct()+"%","intake complete",dw("intake",["You've answered "+this.answered()+" of "+this.totalQ+" questions.","Skipped questions become discovery items, never blockers."],"#/review"))}
   ${kpi(this.answered()+"/"+this.totalQ,"fireside answered",dw("fireside chat",CHAPTERS[0].qs.map(q=>q.t.slice(0,44)+(String(this.state.answers[q.k]||"").trim()?" · answered":" · open")),"#/fireside"))}
   ${kpi(String(this.state.files.length+(this.state.briefcase||[]).length),"files + pulls",dw("the briefcase",[...(this.state.briefcase||[]).map(d=>d.title+" · "+d.facts+" facts"),...this.state.files.map(f=>f.name+" · "+f.kind)],"#/harvest"))}
   ${kpi(String(stageIdx+1)+"/5","build stage",dw("stage",[stages[stageIdx][0]+": "+stages[stageIdx][1]],"#/dashboard"))}
  </div>
  <h2>Your world</h2>
  <div class="grid2">
   ${card("entities",w.entities.length?w.entities.length+" on record":"Not yet named","The companies and structures you described",dw("entities",w.entities,"#/fireside"))}
   ${card("people",w.people.length?w.people.length+" key people":"Not yet named","Team, bench, and the relationships that carry it",dw("people",w.people,"#/fireside"))}
   ${card("priorities",w.priorities.length?"Top "+w.priorities.length:"Not yet ranked","What matters most right now, in your order",dw("priorities",w.priorities,"#/fireside"))}
   ${card("systems",w.systems.length?w.systems.length+" named":"Not yet named","The tools your operation runs on",dw("systems",w.systems,"#/fireside"))}
  </div>
  <h2 style="margin-top:40px">The build</h2>

  <p style="font-size:14px;color:var(--ash)">Ask from the TAYLOR dock at the bottom of any page. Answers land here.</p>
  ${this.taylorBox("dashboard",1)}
  <div class="rule" style="margin-top:40px"></div>
  <p style="text-align:center"><button class="btn-ghost" style="color:var(--ash);font-size:12px" onclick="COB.clearFlow()">Clear my data</button></p>
  </main></div>`;}
