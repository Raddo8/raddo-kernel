<title>Meet your COB of Business · onboarding</title>
<!--
================================================================================
COB ONBOARDING EXPERIENCE v1 · single-file · dossier brand (chiefofbusiness.ai/login twin)
Built HERE, perfected here, then uploaded to Lovable and served verbatim.

LOVABLE INTEGRATION CONTRACT (wire these, change nothing else):
  1. AUTH: email-first + providers. Wire emailContinue/signup/signin to Supabase Auth (signUp, signInWithPassword); provider buttons to signInWithOAuth (google, apple, azure), WebAuthn passkeys, and SAML SSO. Session -> COB.state.user. Terms/Privacy links point to chiefofbusiness.ai/terms and /privacy (pages owed, KNOX-drafted).
  2. PERSISTENCE: COB.save() currently writes localStorage key "cob_onboarding_v1".
     Mirror the same JSON to intake_state/onboarding_tenants (schema already live in the project).
     Every answer change calls COB.save() -> also debounce-post to Supabase.
  3. FILES: the harvest upload dropzones fire COB.onFileSelected(kind, file) -> wire to storage bucket + intake_files.
  4. ESCALATIONS: COB.escalate(reason) -> insert into onboarding_escalations, then show the built-in confirmation.
  5. STATUS: dashboard build-stage reads COB.state.stage ("intake"|"files"|"build"|"review"|"live") -> read from onboarding_tenants.status.
  6. CONNECTOR URL: replace {{COB_CONNECTOR_URL}} in the connect act when the OAuth endpoint ships.
  Fonts load from fonts.googleapis.com. No other external dependencies. No frameworks.
================================================================================
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --paper:#FAF8F4; --edge:#E5E3DE; --ink:#042C53; --ink-soft:#2A4E78; --charcoal:#2C2C2A; --ash:#5F5E5A;
  --brass:#EF9F27; --brass-deep:#854F0B; --white:#FFFFFF;
  --navy:var(--ink); --marble:var(--paper); --marble-2:#F3F0EA; --marble-3:#ECE8DF; --line:var(--edge); --brass-brown:var(--brass-deep);
  --ok:#2E6B4F; --warn:#8A5A00; --err:#8C2F2F;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px; --s7:64px;
  --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:20px; --t-xl:28px; --t-2xl:clamp(30px,4.5vw,44px); --t-hero:clamp(38px,5.5vw,60px);
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--charcoal);font-family:var(--sans);font-size:var(--t-md);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
img,svg,video,table{max-width:100%}
h1,h2,h3{font-family:var(--serif);color:var(--ink);font-weight:700;line-height:1.12;margin:0 0 var(--s3);letter-spacing:-0.01em}
h1{font-size:var(--t-2xl)} h2{font-size:var(--t-xl)} h3{font-size:var(--t-lg)}
p{margin:0 0 var(--s3)}
a{color:var(--brass-deep);text-underline-offset:3px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:var(--s3)}
.kicker b{color:var(--brass);font-weight:500}
.hairline{display:flex;align-items:center;gap:8px;margin:var(--s5) 0}
.hairline::before,.hairline::after{content:"";height:1px;flex:1;background:rgba(239,159,39,.4)}
.hairline i{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:none}
button{font-family:var(--sans);cursor:pointer;font-size:var(--t-sm)}
.btn{background:var(--brass);color:var(--ink);border:none;border-radius:3px;padding:14px 30px;font-weight:600;font-size:15px;letter-spacing:.01em;transition:background .22s var(--ease),color .22s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--brass-deep);color:var(--paper)} .btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn2{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;padding:12px 24px;font-weight:500;transition:background .22s var(--ease),transform .12s var(--ease)}
.btn2:hover{background:var(--marble-2)} .btn2:active{transform:scale(.98)}
.btn-ghost{background:none;border:none;color:var(--brass-deep);padding:10px 8px;font-weight:500}
.btn-ghost:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input[type=text],input[type=email],input[type=password],textarea,select{
  width:100%;background:var(--white);border:1px solid var(--edge);border-radius:0;padding:14px 16px;font-family:var(--sans);font-size:var(--t-md);color:var(--charcoal);transition:border-color .22s var(--ease)}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
textarea{min-height:130px;resize:vertical;line-height:1.6}
::placeholder{color:#A8A499;font-style:normal}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
/* chrome header: paper, per dossier header doctrine */
.top{position:sticky;top:0;z-index:40;background:rgba(250,248,244,.92);backdrop-filter:blur(8px);color:var(--ink);display:flex;align-items:center;gap:var(--s3);padding:12px var(--s4);border-bottom:1px solid var(--edge)}
.top .mark{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.top .mark b{color:var(--brass);font-weight:500}
.top .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .save{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);display:flex;align-items:center;gap:7px;white-space:nowrap}
.top .save .dot{width:6px;height:6px;border-radius:50%;background:var(--edge);transition:background .3s}
.top .save.ok .dot{background:var(--brass)}
.progress{position:sticky;top:49px;z-index:39;height:2px;background:var(--marble-3)}
.progress i{display:block;height:100%;background:var(--brass);width:0%;transition:width .4s var(--ease)}
/* layout */
.stage{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:0;max-width:1280px;margin:0 auto;width:100%}
.rail{padding:var(--s5) var(--s3) var(--s5) var(--s4);border-right:1px solid var(--edge);position:sticky;top:72px;align-self:start;max-height:calc(100vh - 72px);overflow-y:auto}
.rail .r-item{display:flex;gap:10px;align-items:baseline;padding:9px 10px;border:none;background:none;width:100%;text-align:left;font-size:var(--t-sm);color:var(--ash);border-left:2px solid transparent;transition:color .18s}
.rail .r-item:hover{color:var(--ink);background:var(--marble-2)}
.rail .r-item.on{border-left-color:var(--brass);color:var(--ink);font-weight:600}
.rail .r-item.done{color:var(--charcoal)}
.rail .r-item.done .r-n{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rail .r-n{font-family:var(--mono);font-size:10px;border:1px solid var(--edge);min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.main{padding:var(--s6) clamp(16px,4vw,56px);min-height:calc(100vh - 72px)}
.world{padding:var(--s5) var(--s4);border-left:1px solid var(--edge);position:sticky;top:72px;align-self:start;max-height:calc(100vh - 72px);overflow-y:auto}
.world h4{font-family:var(--mono);font-size:10px;color:var(--brass-deep);text-transform:uppercase;letter-spacing:.22em;margin:0 0 var(--s3);font-weight:500}
.w-group{margin-bottom:var(--s4)}
.w-label{font-size:10px;color:var(--ash);margin-bottom:6px;font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase}
.chip{display:inline-block;background:var(--white);border:1px solid var(--edge);padding:5px 10px;font-size:var(--t-xs);margin:0 6px 6px 0;animation:rise .3s var(--ease);color:var(--charcoal)}
.chip.navy{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.w-empty{font-size:var(--t-xs);color:#A8A499;font-style:italic}
/* question screens */
.q-wrap{max-width:640px}
.q-count{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ash);margin-bottom:var(--s3)}
.q-text{font-family:var(--serif);font-size:var(--t-xl);font-weight:700;color:var(--ink);line-height:1.25;margin-bottom:var(--s2)}
.q-why{font-size:var(--t-sm);color:var(--ash);margin-bottom:var(--s4)}
.q-input{position:relative;margin-bottom:var(--s3)}
.mic{position:absolute;right:8px;top:8px;background:var(--white);border:1px solid var(--edge);width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--brass-deep);transition:border-color .18s}
.mic:hover{border-color:var(--ink)}
.mic.rec{background:var(--brass);color:var(--ink);border-color:var(--brass);animation:pulse 1.2s infinite}
.mic svg{width:16px;height:16px}
.q-actions{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s4)}
.hintline{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#A8A499;margin-top:var(--s2)}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin:var(--s3) 0}
.choice{border:1px solid var(--edge);background:var(--white);padding:12px 18px;font-size:var(--t-sm);border-radius:0;color:var(--charcoal);transition:border-color .18s,background .18s}
.choice:hover{border-color:var(--ink)} .choice.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* cards */
.card{background:var(--white);border:1px solid var(--edge);padding:var(--s4)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
/* THE NAVY PANE (dossier brand bible §17, verbatim recipe) */
.pane-navy{position:relative;overflow:hidden;color:var(--paper);padding:clamp(32px,6vw,80px);display:flex;flex-direction:column;justify-content:center;
  background-color:var(--ink);
  background-image:
    radial-gradient(ellipse 60% 55% at 82% 12%, rgba(239,159,39,.18), transparent 60%),
    radial-gradient(ellipse 55% 55% at 12% 92%, rgba(42,78,120,.28), transparent 65%),
    linear-gradient(160deg, hsl(211 93% 8%) 0%, #042C53 55%, hsl(210 82% 22%) 100%);}
.pane-navy::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%, black 40%, transparent 85%);
  mask-image:radial-gradient(ellipse 75% 70% at 50% 45%, black 40%, transparent 85%);}
.pane-navy>*{position:relative;z-index:1}
.pane-navy h1{color:var(--paper);font-size:var(--t-hero);line-height:1.05}
.pane-navy p{color:rgba(250,248,244,.78)}
.chip-eyebrow{display:inline-block;background:var(--brass);color:var(--ink);font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;padding:6px 10px;border-radius:3px;margin-bottom:var(--s4);width:max-content}
.brass-u{color:var(--brass);border-bottom:2px solid var(--brass);padding-bottom:2px}
.mono-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:auto;padding-top:var(--s5);flex-wrap:wrap}
.pane-form{padding:clamp(32px,6vw,80px);display:flex;flex-direction:column;justify-content:center;max-width:560px;width:100%;margin:0 auto}
.field{margin-bottom:var(--s3)}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:7px}
.rule{height:1px;background:var(--edge);margin:var(--s4) 0}
.notice{border:1px solid var(--edge);border-left:2px solid var(--brass);background:var(--white);padding:var(--s3);font-size:var(--t-sm);margin:var(--s3) 0;color:var(--charcoal)}
.review-q{border-bottom:1px solid var(--edge);padding:var(--s3) 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:start}
.review-q:last-child{border-bottom:none}
.review-q .rq-t{font-size:var(--t-xs);color:var(--ash)}
.review-q .rq-a{font-size:var(--t-md);color:var(--charcoal);white-space:pre-wrap}
.review-q .rq-a.skip{color:#A8A499;font-style:italic}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--edge)}
.tl .t-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--edge);margin-top:4px;background:var(--white)}
.tl li.done .t-dot{background:var(--ink);border-color:var(--ink)}
.tl li.now .t-dot{background:var(--brass);border-color:var(--brass);animation:pulse 2s infinite}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);margin:var(--s4) 0}
.kpi{background:var(--white);border:1px solid var(--edge);padding:var(--s3);text-align:left;border-radius:0;transition:border-color .18s}
.kpi:hover{border-color:var(--ink)}
.kpi .k-v{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .k-l{font-size:10px;color:var(--ash);font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s3)}
.wcard{background:var(--white);border:1px solid var(--edge);padding:var(--s3);text-align:left;width:100%;transition:border-color .18s}
.wcard:hover{border-color:var(--brass)}
.wcard .wc-k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:6px}
.wcard .wc-t{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:var(--t-lg)}
.wcard .wc-s{font-size:var(--t-sm);color:var(--ash);margin-top:4px}
/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(4,44,83,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--paper);z-index:61;transform:translateX(102%);transition:transform .26s var(--ease);padding:var(--s5);overflow-y:auto;border-left:2px solid var(--brass)}
.drawer.open{transform:none}
/* connect */
.conn{border:1px solid var(--edge);background:var(--white);margin-bottom:var(--s3)}
.conn .c-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);width:100%;background:none;border:none;text-align:left}
.conn .c-ic{width:40px;height:40px;background:var(--marble-2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--ink);font-size:18px;flex:none}
.conn .c-t{font-weight:600;color:var(--ink)} .conn .c-s{font-size:var(--t-xs);color:var(--ash)}
.conn .c-state{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);white-space:nowrap}
.conn.done .c-state{color:var(--ok)} .conn .c-body{display:none;padding:0 var(--s3) var(--s3);border-top:1px solid var(--edge)}
.conn.open .c-body{display:block}
.steps{counter-reset:s;list-style:none;padding:0;margin:var(--s3) 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:8px 0;font-size:var(--t-sm)}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:10px;border:1px solid var(--edge);width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--brass-deep)}
.copybox{position:relative;background:var(--ink);color:#DCE6F2;font-family:var(--mono);font-size:12.5px;padding:var(--s3);white-space:pre-wrap;max-height:300px;overflow:auto;line-height:1.55}
.copybtn{position:sticky;top:0;float:right;background:var(--brass);color:var(--ink);border:none;padding:7px 14px;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono)}
.drop{border:1px dashed #C9C2B4;padding:var(--s4);text-align:center;color:var(--ash);font-size:var(--t-sm);background:var(--white);display:block;cursor:pointer}
.drop.over{border-color:var(--brass);background:var(--marble-2)}
.filelist{list-style:none;padding:0;margin:var(--s2) 0 0}
.filelist li{font-family:var(--mono);font-size:var(--t-xs);padding:6px 0;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;gap:var(--s3)}
/* misc */
.backbar{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap}
.backbar .bb-note{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#A8A499}
.toast{pointer-events:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:12px 22px;font-size:var(--t-sm);z-index:70;opacity:0;transition:all .25s var(--ease);border-left:3px solid var(--brass);max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.milestone{border:1px solid var(--edge);border-top:2px solid var(--brass);background:var(--white);padding:var(--s4);margin:var(--s4) 0;animation:rise .35s var(--ease)}
.offline{display:none;background:var(--warn);color:#fff;text-align:center;font-size:var(--t-xs);padding:6px}
body.offline .offline{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,159,39,.5)}50%{box-shadow:0 0 0 7px rgba(239,159,39,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mob-nav{display:none}
.mob-nav.off{display:none!important}
@media (max-width:1080px){.stage{grid-template-columns:220px minmax(0,1fr)}.world{display:none}}
@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .split{grid-template-columns:minmax(0,1fr)}
  .pane-navy{min-height:38vh;justify-content:flex-end;padding-bottom:var(--s4)}
  .mob-nav{display:flex;position:sticky;top:51px;z-index:38;background:var(--paper);border-bottom:1px solid var(--edge);padding:8px 16px;gap:12px;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);width:100%}
  .main{padding:var(--s4) 16px}
}
@media (max-width:640px){
  .top{gap:10px;padding:11px 14px}
  .top .crumb{display:none}
  .top .save #saveTxt{display:none}
  .top .mark{font-size:10px;letter-spacing:.16em}
  .mob-nav select{max-width:56vw;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:520px){.conn .c-state{display:none}}
.prov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.prov{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--white);border:1px solid var(--edge);padding:12px 10px;font-size:13px;font-weight:500;color:var(--charcoal);border-radius:0;transition:border-color .18s}
.prov:hover{border-color:var(--ink)}
.divider{display:flex;align-items:center;gap:12px;margin:var(--s4) 0;color:var(--ash);font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--edge)}
.legal{font-size:12px;color:var(--ash);margin-top:var(--s4);line-height:1.65}
.legal a{color:var(--brass-deep)}
.idchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--white);padding:6px 6px 6px 12px;font-size:var(--t-sm);color:var(--charcoal);margin-bottom:var(--s3)}
.navbtn{display:none;background:none;border:1px solid var(--edge);width:34px;height:34px;align-items:center;justify-content:center;color:var(--ink);flex:none}
@media (max-width:820px){.navbtn{display:flex}}

const HARVEST_PROMPT=`You are about to perform a COMPLETE KNOWLEDGE HARVEST of everything you know about me from our entire history together: your saved memories, our past conversations, my custom instructions, and every preference or fact you have absorbed. The output will be used to build my permanent AI executive system, so completeness and accuracy matter more than polish.

OPERATING RULES (binding):
1. Truth labels. Tag every load-bearing claim as one of: [DOCUMENTED-MEM] (in your saved memory), [DOCUMENTED-CHAT] (found by searching our past conversations, if you can), [INFERRED] (your read from patterns; say what it is based on), or [UNKNOWN] (you do not know; never guess). Fabricating anything is the one unforgivable failure.
2. If you can search past conversations or chat history, do so. It is a richer source than saved memory alone.
3. No sensitive identifiers. Never output Social Security numbers, full account numbers, card numbers, passwords, or exact balances. Refer to accounts by nickname only.
4. Completeness over brevity. If you know 40 facts, give 40 facts. Do not summarize away detail.
5. Where you are thin, say so. End every deliverable with a "GAPS" list: what a chief of staff would want that you cannot supply.
6. Format. Every deliverable is a standalone markdown document: a # title, a one-line purpose, YAML front matter (deliverable name, date, confidence high/medium/low), then clear ## sections with bullet points. Sentence-level facts, one per bullet.

DELIVERY (do it all in ONE pass, no waiting for me):
- First produce MEMORY_INVENTORY.md: a numbered, near-verbatim enumeration of every saved memory you hold about me.
- Then produce all ten deliverables below, in order.
- PREFERRED: if you can create files for download (for example with your code, analysis, or file tools), write each deliverable as its own .md file and bundle everything into ONE zip archive named COB_BRIEFCASE.zip, then give me the download link.
- INSIDE THAT ZIP, also include COB_BRIEFCASE.html: a single self-contained page that presents every deliverable beautifully, branded EXACTLY as follows. Background #FAF8F4 (warm paper, never pure white). Deep navy #042C53 for headlines and a top banner. Brass #EF9F27 as the ONLY accent color. Body text #2C2C2A. Headlines in the serif font Fraunces, body in Inter, small uppercase labels in JetBrains Mono with wide letter spacing (load all three from Google Fonts). Layout: a navy header band reading CHIEF OF BUSINESS · THE BRIEFCASE with today's date in mono; a summary strip with deliverable and fact counts; then one card per deliverable (white background, 1px #E5E3DE border, square corners) showing the title, a small confidence badge, collapsible sections for its contents, and any GAPS section highlighted with a brass left border. No em dashes anywhere in it. No external scripts; all content embedded inline so the page opens offline with a double click.
- FALLBACK: if you cannot create files, deliver everything in continuous messages, and begin each deliverable with a marker line exactly like this: === FILE: IDENTITY_PROFILE.md ===
- If length forces you to split across messages, continue automatically; do not stop to ask.

THE TEN DELIVERABLES:

1. IDENTITY_PROFILE.md
Who I am: name, location, family facts you know, roles and titles, entities I own or lead, professional history, public footprint, how I describe myself, what I care about most. Include a "how I make decisions" section based on everything you have seen.

2. VENTURES_AND_ENTITIES.md
Every business, entity, deal, investment, and project you know of: legal structure, ownership stakes, status, key numbers mentioned, stage, what is in flight, what is stalled. One ## section per entity. Include deals or ideas I mentioned once and dropped, flagged as such.

3. PEOPLE_MAP.md
Every person you know in my world: name, relationship to me, role, organization, context of how they come up, current state of the relationship, and any open items between us. Group by category (family, partners, investors, advisors, counterparties, team, friends).

4. WORKFLOWS_AND_PROCESSES.md
How I actually work: recurring processes you have watched me run, how I handle email, meetings, follow-ups, content, sales, finance, and admin. What I do repeatedly, in what order, with what tools. Include the processes I have complained about or asked for help with more than once, and where the friction is.

5. GOALS_VISION_VALUES.md
My stated goals (short and long horizon), the vision behind them, my priorities as I have ranked or implied them, values I have expressed, lines I will not cross, and what winning looks like in my own words. Quote me where you can.

6. DECISIONS_LOG.md
Significant decisions I have made or worked through with you: the decision, when, the options weighed, what I chose, the reasoning, and anything left conditional. Include decisions I keep revisiting without closing, flagged as open decision debt.

7. OPEN_LOOPS.md
Every commitment, pending item, deadline, follow-up, or "I need to..." you have record of that was never confirmed closed. For each: what it is, who is waiting on it, any date attached, and last known status.

8. PREFERENCES_AND_STYLE.md
How I like to work with an AI and with people: communication style, formats I prefer, length and tone, things that irritate me, standing instructions I have given you, how I want pushback delivered, and every correction I have made to your behavior.

9. TOOLS_AND_SYSTEMS.md
My stack: every tool, platform, app, and system I have mentioned using (email, calendar, accounting, CRM, banking, project tools, AI tools, industry-specific software), how each is used, what is connected to what, and pain points with any of them.

10. HANDOFF_BRIEF.md
The synthesis: if you were briefing my new chief of staff on day one, the twenty things they must know, the three biggest risks on my plate, the three biggest opportunities, what to never do, and the first five actions you would tell them to take. Close with a master GAPS list across all deliverables and a completeness self-score (0 to 100) with one line of justification.

Begin now.`;
window.HARVEST_PROMPT=HARVEST_PROMPT;

 {id:"cob",t:"Chief of Business",s:"Your COB's brain. This one comes first.",required:1,steps:[
   "Open Claude and sign in (claude.ai or the desktop app).",
   "Go to Settings, then Connectors.",
   "Choose Add custom connector.",

 {id:"gmail",t:"Email",s:"So your COB can watch the inbox rhythm.",steps:["In Claude, open Settings, then Connectors.","Find Gmail (or your provider) in the directory and choose Connect.","Sign in with the email account you named in chapter 10 and approve."]},
 {id:"gcal",t:"Calendar",s:"Your real schedule, protected.",steps:["Settings, then Connectors.","Find Google Calendar (or your provider) and choose Connect.","Approve access for the calendar your real schedule lives on."]},

const COB={
 state:{user:null,consentName:"",consentAt:null,gate:{},answers:{},skipped:{},files:[],connectors:{},stage:"intake",claude:null,escalated:false},
 KEY:"cob_onboarding_v1",
 totalQ:CHAPTERS.reduce((a,c)=>a+c.qs.length,0),
 RES:["#/consent","#/gate","#/reveal","#/plugin","#/harvest","#/world","#/ch/0/0","#/review","#/claude","#/connect","#/dashboard"],
 J:[["The study","#/reveal"],["Connections","#/plugin"],["Memory pull","#/harvest"],["Your world, drafted","#/world"],["Only you","#/ch/0/0"],["Review","#/review"],["Claude","#/claude"],["Wire together","#/connect"],["Your build","#/dashboard"]],
 stepDone(hash){const idx=this.RES.indexOf(hash==="#/ch/0/0"?"#/ch/0/0":hash);return idx>-1&&(this.state.reached||0)>idx;},
 navItems(){const cur=location.hash||"#/welcome";
  return this.J.map((s,i)=>{const on=cur.split("/")[1]===s[1].split("/")[1];
   return `<button class="r-item ${on?"on":""} ${this.stepDone(s[1])?"done":""}" onclick="COB.navClose();COB.go('${s[1]}')"><span class="r-n">${this.stepDone(s[1])?"✓":i+1}</span><span>${s[0]}</span></button>`;}).join("");},
 taylorBox(ctx,big){const id="tq-"+ctx.replace(/[^a-z0-9]/gi,"");
  return `<div class="tay"><div class="t-l">ask taylor · your guide</div>
   ${big?`<textarea id="${id}" placeholder="Ask anything about this step. TAYLOR answers on your dashboard."></textarea>`:`<input type="text" id="${id}" placeholder="Stuck? Ask TAYLOR anything..." onkeydown="if(event.key==='Enter')COB.askTaylor('${ctx}','${id}')">`}
   <div class="t-row"><button class="btn2" style="padding:9px 16px;font-size:13px" onclick="COB.askTaylor('${ctx}','${id}')">Send to TAYLOR</button></div>
   ${(this.state.taylor_qs||[]).filter(q=>q.ctx===ctx).map(q=>`<p class="t-hint">"${this.esc(q.q.slice(0,70))}" · with TAYLOR</p>`).join("")}</div>`;},
 askTaylor(ctx,id){const el=document.getElementById(id);const v=(el&&el.value||"").trim();
  if(!v){this.toast("Type the question first; TAYLOR reads every word.");return;}
  this.state.taylor_qs=this.state.taylor_qs||[];this.state.taylor_qs.push({ctx,q:v.slice(0,500),at:new Date().toISOString()});
  if(el)el.value="";this.save();this.render();/* LOVABLE: insert taylor_questions row; TAYLOR (connector agent) answers to dashboard */
  this.toast("TAYLOR has it. The answer meets you on your dashboard.");},
 navOpen(){document.getElementById('snav').innerHTML=`<p class="kicker" style="margin:8px 0 14px">your journey</p>${this.navItems()}${this.taylorBox("sidenav")}<p style="margin-top:16px;text-align:center"><button class="btn-ghost" style="color:var(--ash);font-size:11px" onclick="COB.clearFlow()">Clear my data</button></p>`;
  document.getElementById('snav').classList.add('open');document.getElementById('snavBg').classList.add('open');},

 clearFlow(){this.navClose();this.openDrawer(`<p class="kicker">clear my data</p>
  <h3 style="margin-bottom:8px">You are about to erase everything.</h3>
  <p style="font-size:14px">This permanently removes from this device: every answer you've given, your briefcase and its deliverables, your uploaded file record, your progress, and your session. You would start again from the very beginning.</p>
  <p style="font-size:14px">At integration this also files a deletion request against your account record, executed completely and confirmed when done. Erasure is your right; we just want you certain.</p>
  <div class="notice"><b>This cannot be undone.</b> If you only want a break, just close the tab: everything saves itself and waits for you.</div>
  <div class="field" style="margin-top:14px"><label for="clr-in">Type ERASE to confirm</label><input type="text" id="clr-in" placeholder="ERASE" autocomplete="off"></div>
  <div class="q-actions"><button class="btn2" style="border-color:var(--err);color:var(--err)" onclick="COB.clearConfirm()">Erase everything</button>
  <button class="btn-ghost" onclick="COB.closeDrawer()">Keep my work</button></div>`);},
 clearConfirm(){const v=(document.getElementById('clr-in').value||"").trim();
  if(v!=="ERASE"){this.toast("Type ERASE exactly to confirm. Anything else keeps your work safe.");return;}
  try{localStorage.removeItem(this.KEY);}catch(e){}
  this.state={user:null,consentName:"",consentAt:null,gate:{},answers:{},skipped:{},files:[],connectors:{},stage:"intake",claude:null,escalated:false};

 load(){try{const r=localStorage.getItem(this.KEY);if(r)Object.assign(this.state,JSON.parse(r));}catch(e){}},

 /* ---- world extraction ---- */

 /* ---- router ---- */

  const crumbs={welcome:"welcome",account:"create your account",consent:"consent · scope",gate:"three quick questions",reveal:"we come prepared",plugin:"build your corner",world:"your world, drafted",ch:"",review:"review everything",harvest:"the memory pull",claude:"your COB lives in claude",connect:"connect your world",done:"all set",dashboard:"your build"};

  document.getElementById('crumb').textContent=crumb;
  const _ri=this.RES.findIndex(h=>("#/"+r.p).startsWith(h.split("/").slice(0,2).join("/"))&&(r.p!=="ch"||h==="#/ch/0/0"));
  if(_ri>-1&&_ri>(this.state.reached||0)){this.state.reached=_ri;this.save();}
  const needsUser=["consent","gate","reveal","plugin","world","ch","review","harvest","claude","connect","done","dashboard"];
  if(needsUser.includes(r.p)&&!this.state.user){this.go("#/account");return;}
  if(r.p==="welcome")app.innerHTML=this.vWelcome();
  else if(r.p==="account")app.innerHTML=this.vAccount();
  else if(r.p==="consent")app.innerHTML=this.shell(this.vConsent(),null);
  else if(r.p==="gate")app.innerHTML=this.shell(this.vGate(),null);
  else if(r.p==="reveal")app.innerHTML=this.shell(this.vReveal(),null);
  else if(r.p==="plugin")app.innerHTML=this.shell(this.vPlugin(),null);
  else if(r.p==="world")app.innerHTML=this.shell(this.vUnderstanding(),null);
  else if(r.p==="ch")app.innerHTML=this.shell(this.vQuestion(+r.a,+r.b),+r.a);
  else if(r.p==="review")app.innerHTML=this.shell(this.vReview(),null);
  else if(r.p==="harvest")app.innerHTML=this.shell(this.vHarvest(),null);
  else if(r.p==="claude")app.innerHTML=this.shell(this.vClaude(),null);
  else if(r.p==="connect")app.innerHTML=this.shell(this.vConnect(),null);

  <p style="text-align:center"><button class="btn-ghost" style="color:var(--ash);font-size:12px" onclick="COB.clearFlow()">Clear my data</button></p>
  </main></div>`;}
};
/* boot */
COB.load();
window.addEventListener('hashchange',()=>COB.render());
window.addEventListener('online',()=>{document.body.classList.remove('offline');COB.toast("Back online. Everything synced.");});
window.addEventListener('offline',()=>document.body.classList.add('offline'));
window.addEventListener('keydown',e=>{if(e.key==="Escape")COB.closeDrawer();});
document.getElementById('saveTxt').textContent="autosave on";
COB.render();
</script>
</body>
</html>
